<div class="web-list-item" style="padding: 15px; border-bottom: 1px solid #eee;">
	<div style="display: flex; justify-content: space-between; align-items: center;">
		<div>
			<strong>{{ doc.source_airport_code }} &rarr; {{ doc.destination_airport_code }}</strong>
			&nbsp;|&nbsp;
			{{ frappe.utils.format_date(doc.date_of_departure, "d MMMM, YYYY") }}
			&nbsp;|&nbsp;
			{{ doc.time_of_departure }}
			&nbsp;|&nbsp;
			{{ frappe.utils.format_duration(doc.duration) }}
		</div>
		<a href="{{ doc.route }}" class="btn btn-sm btn-default">View Flight</a>
	</div>
</div>
